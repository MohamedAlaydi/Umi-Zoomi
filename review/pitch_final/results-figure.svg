<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-label="Screen scores, two conditional affinity estimates and interface PAE for all four designs. All values are model outputs, not laboratory measurements."><g font-family="Bricolage Grotesque,Arial,sans-serif" fill="#17150F"><text x="0" y="30" font-size="29" font-weight="800">Four variants: different model signals</text><text x="0" y="70" font-size="21">Computed results. Binding and thermal stability unmeasured.</text><text x="0" y="115" font-size="21" font-weight="800">Design</text><text x="125" y="115" font-size="21" font-weight="800">Screen</text><text x="125" y="141" font-size="21" font-weight="800">score</text><text x="305" y="115" font-size="21" font-weight="800">Estimated KD / WT</text><text x="305" y="141" font-size="21" font-weight="800">Ridge / GP</text><text x="645" y="115" font-size="21" font-weight="800">Interface</text><text x="645" y="141" font-size="21" font-weight="800">PAE, Å</text><path d="M0 158H800" stroke="#17150F" stroke-width="3"/><text x="0" y="201" font-size="24" font-weight="700">Pick 01</text><text x="125" y="201" font-size="24" font-weight="700">0.16</text><text x="305" y="201" font-size="24" font-weight="700">2.94× / 0.94×</text><text x="645" y="201" font-size="24" font-weight="700">3.05</text><path d="M0 222H800" stroke="#17150F" stroke-width="1" opacity=".2"/><text x="0" y="265" font-size="24" font-weight="700">Pick 02</text><text x="125" y="265" font-size="24" font-weight="700">0.16*</text><text x="305" y="265" font-size="24" font-weight="700">2.94× / 0.94×*</text><text x="645" y="265" font-size="24" font-weight="700">3.51</text><path d="M0 286H800" stroke="#17150F" stroke-width="1" opacity=".2"/><text x="0" y="329" font-size="24" font-weight="700">Pick 03</text><text x="125" y="329" font-size="24" font-weight="700">0.84</text><text x="305" y="329" font-size="24" font-weight="700">5.84× / 2.31×</text><text x="645" y="329" font-size="24" font-weight="700">3.08</text><path d="M0 350H800" stroke="#17150F" stroke-width="1" opacity=".2"/><text x="0" y="393" font-size="24" font-weight="700">Pick 04</text><text x="125" y="393" font-size="24" font-weight="700">0.27*</text><text x="305" y="393" font-size="24" font-weight="700">3.96× / 2.96×*</text><text x="645" y="393" font-size="24" font-weight="700">4.02</text><path d="M0 414H800" stroke="#17150F" stroke-width="1" opacity=".2"/><text x="0" y="455" font-size="20">KD / WT: lower means tighter binding; 1× is historical WT KD.</text><text x="0" y="488" font-size="20">* H3-only assay scores. Framework effect is not modelled.</text><text x="0" y="521" font-size="20">Estimates are uncertain; even WT is poorly calibrated.</text><text x="0" y="554" font-size="20">PAE is predicted interface uncertainty, not measured error.</text><text x="0" y="587" font-size="20">Mol1 also recovers 19/19 reference contacts for all four.</text></g></svg>